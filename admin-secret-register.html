<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - Secret Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Admin <span>Register</span></h2>
                <p style="color: #8ab4d6;">🔒 Secret Admin Registration Page</p>
            </div>

            <form id="adminRegisterForm">
                <div class="input-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="name" placeholder="Enter admin name" required>
                </div>

                <div class="input-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="email" placeholder="Enter admin email" required>
                </div>

                <div class="input-group">
                    <label>🔑 Password</label>
                    <input type="password" id="password" placeholder="Enter admin password" required>
                </div>

                <button type="submit" class="btn-primary">Register Admin →</button>
            </form>

            <span class="toggle-link" onclick="window.location.href='admin_login.html'">
                Already registered? Admin Login here
            </span>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        document.getElementById('adminRegisterForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/admin_register_api.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                alert(data.message);

                if (data.status === 'success') {
                    window.location.href = 'admin_login.html';
                }
            } catch (error) {
                alert('Could not connect to server. Please make sure the PHP server is running.');
            }
        });
    </script>
</body>
</html>
