<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Login & Register</title>
    <meta name="description" content="Task Manager application with login and registration functionality.">
    <link rel="stylesheet" href="styles.css">

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({ name: '', email: '', password: '' });

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                // PHP API endpoint
                const endpoint = isLogin 
                    ? 'http://localhost:8000/login_api.php' 
                    : 'http://localhost:8000/register_api.php';

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();

                    if (data.status === 'success') {
                        if (isLogin) {
                            // Save user data to localStorage for dashboard
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('userId', data.user_id);
                            localStorage.setItem('userName', data.user || 'User');
                            localStorage.setItem('userEmail', formData.email);
                            alert(data.message);
                            window.location.href = 'dashboard.html';
                        } else {
                            alert(data.message);
                            setIsLogin(true); // Switch to login page after registration
                        }
                    } else {
                        alert(data.message);
                    }
                } catch (error) {
                    alert('Could not connect to the server. Please make sure the PHP server is running.');
                }
            };

            return (
                <div className="auth-container">
                    <div className="auth-box">
                        <div className="auth-header">
                            <h2>{isLogin ? 'Welcome ' : 'Create '}<span>{isLogin ? 'Back' : 'Account'}</span></h2>
                            <p style={{ color: '#8ab4d6' }}>
                                {isLogin ? 'Login to manage your tasks' : 'Register to get started'}
                            </p>
                        </div>

                        <form onSubmit={handleSubmit}>
                            {!isLogin && (
                                <div className="input-group">
                                    <label>👤 Full Name</label>
                                    <input 
                                        type="text" 
                                        name="name" 
                                        placeholder="Enter your name" 
                                        onChange={handleChange} 
                                        required 
                                    />
                                </div>
                            )}

                            <div className="input-group">
                                <label>📧 Email Address</label>
                                <input 
                                    type="email" 
                                    name="email" 
                                    placeholder="Enter your email" 
                                    onChange={handleChange} 
                                    required 
                                />
                            </div>

                            <div className="input-group">
                                <label>🔑 Password</label>
                                <input 
                                    type="password" 
                                    name="password" 
                                    placeholder="Enter your password" 
                                    onChange={handleChange} 
                                    required 
                                />
                            </div>

                            <button type="submit" className="btn-primary">
                                {isLogin ? 'Login →' : 'Register →'}
                            </button>
                        </form>

                        <span className="toggle-link" onClick={() => setIsLogin(!isLogin)}>
                            {isLogin ? "Don't have an account? Register here" : "Already have an account? Login here"}
                        </span>

                        <div style={{
                            marginTop: '20px',
                            paddingTop: '20px',
                            borderTop: '1px solid rgba(45, 109, 168, 0.2)',
                            textAlign: 'center'
                        }}>
                            <a 
                                href="admin_login.html"
                                style={{
                                    color: '#a78bfa',
                                    fontSize: '13px',
                                    textDecoration: 'none',
                                    fontWeight: '600',
                                    transition: 'all 0.3s'
                                }}
                                onMouseOver={(e) => e.target.style.color = '#c4b5fd'}
                                onMouseOut={(e) => e.target.style.color = '#a78bfa'}
                            >
                                🛡️ Login as Admin
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the React app into the root div
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
