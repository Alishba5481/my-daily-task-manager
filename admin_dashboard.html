<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #111827 50%, #1a2332 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e8f0fe;
        }

        .admin-container { max-width: 1200px; margin: 0 auto; }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(145deg, #111827, #1e293b);
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-left .logo { font-size: 30px; }
        .header-left h1 { font-size: 24px; color: #e8f0fe; }
        .header-left h1 span { color: #a78bfa; }

        .header-left .badge {
            font-size: 11px; padding: 4px 14px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px; color: #c4b5fd;
        }

        .header-right { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }

        .admin-info { display: flex; align-items: center; gap: 12px; }
        .admin-info .avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 18px; font-weight: bold; color: white;
        }
        .admin-info .admin-name { font-weight: 500; color: #e8f0fe; }
        .admin-info .admin-email { font-size: 12px; color: #6b7280; }

        .logout-btn {
            padding: 10px 25px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px; cursor: pointer; font-size: 14px;
            font-weight: 600; transition: all 0.3s;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.25); transform: translateY(-2px); }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(145deg, #111827, #1e293b);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); border-color: rgba(139, 92, 246, 0.3); }
        .stat-card .stat-icon { font-size: 40px; margin-bottom: 10px; }
        .stat-card .stat-number { font-size: 36px; font-weight: 700; color: #a78bfa; }
        .stat-card .stat-label { font-size: 14px; color: #9ca3af; margin-top: 5px; }

        /* ===== SECTIONS ===== */
        .section {
            background: linear-gradient(145deg, #111827, #1e293b);
            padding: 25px 30px;
            border-radius: 15px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .section-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
            flex-wrap: wrap; gap: 10px;
        }
        .section-header h3 { font-size: 18px; color: #e8f0fe; }
        .section-header h3 i { margin-right: 10px; }

        .count-badge {
            font-size: 13px; color: #c4b5fd;
            background: rgba(139, 92, 246, 0.15);
            padding: 5px 15px; border-radius: 20px;
        }

        /* ===== TABLE ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table thead th {
            text-align: left;
            padding: 14px 16px;
            background: rgba(139, 92, 246, 0.1);
            color: #c4b5fd;
            font-weight: 600;
            border-bottom: 2px solid rgba(139, 92, 246, 0.2);
            white-space: nowrap;
        }

        .data-table tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #d1d5db;
        }

        .data-table tbody tr {
            transition: all 0.2s;
        }

        .data-table tbody tr:hover {
            background: rgba(139, 92, 246, 0.05);
        }

        .user-cell {
            display: flex; align-items: center; gap: 10px;
        }
        .user-cell .mini-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 13px; font-weight: bold;
            color: white; flex-shrink: 0;
        }

        .task-count-badge {
            display: inline-block; padding: 4px 12px;
            border-radius: 12px; font-size: 12px; font-weight: 600;
        }
        .task-count-badge.high { background: rgba(34, 197, 94, 0.15); color: #86efac; }
        .task-count-badge.medium { background: rgba(234, 179, 8, 0.15); color: #fde047; }
        .task-count-badge.low { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }

        .task-desc {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #9ca3af;
        }

        /* ===== FILTER TABS ===== */
        .filter-tabs {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .filter-tab {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 8px; color: #9ca3af;
            cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.3s;
        }
        .filter-tab:hover { background: rgba(139, 92, 246, 0.1); color: #c4b5fd; }
        .filter-tab.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
            color: #a78bfa;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center; color: #6b7280;
            padding: 40px; font-size: 15px;
        }
        .empty-state .emoji { font-size: 50px; display: block; margin-bottom: 12px; }

        /* ===== LOADING ===== */
        .loading { text-align: center; color: #9ca3af; padding: 30px; font-size: 15px; }

        /* ===== TABLE SCROLL ===== */
        .table-wrapper { overflow-x: auto; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .header-right { justify-content: center; }
            .section { padding: 18px 15px; }
            .data-table { font-size: 13px; }
            .data-table thead th, .data-table tbody td { padding: 10px 8px; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🛡️</span>
                <h1>Admin<span>Panel</span></h1>
                <span class="badge">🔒 Admin Access</span>
            </div>
            <div class="header-right">
                <div class="admin-info">
                    <div class="avatar" id="adminAvatar">A</div>
                    <div>
                        <div class="admin-name" id="adminName">Admin</div>
                        <div class="admin-email" id="adminEmail">admin@email.com</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="adminLogout()">🚪 Logout</button>
            </div>
        </header>

        <!-- ===== STATS ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-number" id="avgTasks">0</div>
                <div class="stat-label">Avg Tasks / User</div>
            </div>
        </div>

        <!-- ===== USERS TABLE ===== -->
        <div class="section">
            <div class="section-header">
                <h3><i>👥</i> Registered Users</h3>
                <span class="count-badge" id="usersCount">0 users</span>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Email</th>
                            <th>Total Tasks</th>
                            <th>Last Task Date</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" class="loading">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ===== ALL TASKS TABLE ===== -->
        <div class="section">
            <div class="section-header">
                <h3><i>📝</i> All Tasks</h3>
                <span class="count-badge" id="tasksCount">0 tasks</span>
            </div>

            <!-- Filter tabs -->
            <div class="filter-tabs" id="filterTabs">
                <div class="filter-tab active" onclick="filterTasks('all')">All Tasks</div>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Task Title</th>
                            <th>Description</th>
                            <th>User</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <tr><td colspan="6" class="loading">Loading tasks...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const API_BASE = 'http://localhost:8000';

        // ============================================
        // CHECK ADMIN LOGIN
        // ============================================
        const isAdminLoggedIn = localStorage.getItem('isAdminLoggedIn');
        const adminId = localStorage.getItem('adminId');

        if (!isAdminLoggedIn || !adminId) {
            window.location.href = 'admin_login.html';
        }

        // ============================================
        // DISPLAY ADMIN INFO
        // ============================================
        const adminName = localStorage.getItem('adminName') || 'Admin';
        const adminEmail = localStorage.getItem('adminEmail') || '';

        document.getElementById('adminName').textContent = adminName;
        document.getElementById('adminAvatar').textContent = adminName.charAt(0).toUpperCase();
        document.getElementById('adminEmail').textContent = adminEmail;

        // ============================================
        // STORE DATA
        // ============================================
        let allTasks = [];
        let allUsers = [];

        // ============================================
        // LOAD ALL DATA
        // ============================================
        async function loadAdminData() {
            try {
                const response = await fetch(`${API_BASE}/admin_get_data_api.php?admin_id=${adminId}`);
                const data = await response.json();

                if (data.status === 'success') {
                    allUsers = data.users;
                    allTasks = data.tasks;

                    // Update stats
                    document.getElementById('totalUsers').textContent = data.total_users;
                    document.getElementById('totalTasks').textContent = data.total_tasks;
                    const avg = data.total_users > 0 ? (data.total_tasks / data.total_users).toFixed(1) : '0';
                    document.getElementById('avgTasks').textContent = avg;

                    // Render tables
                    renderUsersTable(allUsers);
                    renderTasksTable(allTasks);
                    buildFilterTabs(allUsers);

                    // Update counts
                    document.getElementById('usersCount').textContent = `${data.total_users} users`;
                    document.getElementById('tasksCount').textContent = `${data.total_tasks} tasks`;
                } else {
                    alert(data.message);
                }
            } catch (error) {
                document.getElementById('usersTableBody').innerHTML = 
                    '<tr><td colspan="5" class="empty-state">Could not connect to server.</td></tr>';
                document.getElementById('tasksTableBody').innerHTML = 
                    '<tr><td colspan="6" class="empty-state">Could not connect to server.</td></tr>';
            }
        }

        // ============================================
        // RENDER USERS TABLE
        // ============================================
        function renderUsersTable(users) {
            const tbody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><span class="emoji">👥</span>No registered users yet.</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => {
                const taskCount = parseInt(user.total_tasks);
                let badgeClass = 'low';
                if (taskCount >= 5) badgeClass = 'high';
                else if (taskCount >= 2) badgeClass = 'medium';

                return `
                    <tr>
                        <td>#${user.id}</td>
                        <td>
                            <div class="user-cell">
                                <div class="mini-avatar">${user.name.charAt(0).toUpperCase()}</div>
                                <span>${escapeHtml(user.name)}</span>
                            </div>
                        </td>
                        <td>${escapeHtml(user.email)}</td>
                        <td><span class="task-count-badge ${badgeClass}">${taskCount} tasks</span></td>
                        <td>${user.last_task_date ? new Date(user.last_task_date).toLocaleDateString() : 'No tasks yet'}</td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================
        // RENDER TASKS TABLE
        // ============================================
        function renderTasksTable(tasks) {
            const tbody = document.getElementById('tasksTableBody');

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><span class="emoji">📭</span>No tasks found.</td></tr>';
                return;
            }

            tbody.innerHTML = tasks.map(task => `
                <tr>
                    <td>#${task.task_id}</td>
                    <td><strong>${escapeHtml(task.title)}</strong></td>
                    <td><div class="task-desc">${task.description ? escapeHtml(task.description) : '—'}</div></td>
                    <td>
                        <div class="user-cell">
                            <div class="mini-avatar">${task.user_name.charAt(0).toUpperCase()}</div>
                            <div>
                                <div>${escapeHtml(task.user_name)}</div>
                                <div style="font-size:11px;color:#6b7280;">${escapeHtml(task.user_email)}</div>
                            </div>
                        </div>
                    </td>
                    <td>${new Date(task.created_at).toLocaleString()}</td>
                    <td>${task.updated_at !== task.created_at ? new Date(task.updated_at).toLocaleString() : '—'}</td>
                </tr>
            `).join('');
        }

        // ============================================
        // BUILD FILTER TABS (by user)
        // ============================================
        function buildFilterTabs(users) {
            const container = document.getElementById('filterTabs');
            let tabs = '<div class="filter-tab active" onclick="filterTasks(\'all\')">All Tasks</div>';

            users.forEach(user => {
                if (parseInt(user.total_tasks) > 0) {
                    tabs += `<div class="filter-tab" onclick="filterTasks(${user.id})">${escapeHtml(user.name)} (${user.total_tasks})</div>`;
                }
            });

            container.innerHTML = tabs;
        }

        // ============================================
        // FILTER TASKS BY USER
        // ============================================
        function filterTasks(userId) {
            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            if (userId === 'all') {
                renderTasksTable(allTasks);
                document.getElementById('tasksCount').textContent = `${allTasks.length} tasks`;
            } else {
                const filtered = allTasks.filter(t => parseInt(t.user_id) === userId);
                renderTasksTable(filtered);
                document.getElementById('tasksCount').textContent = `${filtered.length} tasks`;
            }
        }

        // ============================================
        // ADMIN LOGOUT
        // ============================================
        function adminLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('isAdminLoggedIn');
                localStorage.removeItem('adminId');
                localStorage.removeItem('adminName');
                localStorage.removeItem('adminEmail');
                window.location.href = 'admin_login.html';
            }
        }

        // ============================================
        // UTILITY
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // LOAD DATA ON PAGE LOAD
        // ============================================
        loadAdminData();

        // Auto-refresh every 30 seconds
        setInterval(loadAdminData, 30000);
    </script>
</body>
</html>
